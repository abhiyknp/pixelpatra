# Publishes the whole Pixelpatra demo site to GitHub Pages on every push to main that changes it:
#   https://abhiyknp.github.io/pixelpatra/            the store page
#   https://abhiyknp.github.io/pixelpatra/demo/       the demo picker (dropdowns for every sample)
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Pages on a private repository needs a paid GitHub plan; on the free plan the repository has to be public.
name: Pixelpatra site (GitHub Pages)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # actions are pinned to exact commits, so a moved tag can't change the build
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html animations.html intro.html _site/
          cp -r demo _site/demo
          for d in Sample_1 House_3D_Prototype Sample_2 kits; do
            mkdir -p "_site/$d"
            (cd "$d" && tar --exclude=./tools --exclude=./.preview --exclude=./.cache --exclude='*.md' --exclude=./.gitignore --exclude=serve.sh --exclude=page.html -cf - .) | (cd "_site/$d" && tar -xf -)
          done
          # the scroll intros page is written as page content: give it a full HTML document
          {
            printf '%s' '<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}</style></head><body>'
            cat kits/scroll-intros/index.html
            printf '%s' '</body></html>'
          } > _site/kits/scroll-intros/index.html
          touch _site/.nojekyll
      - name: Add the security policy to the two shop samples
        run: |
          node Sample_1/tools/add-csp.js _site/Sample_1/index.html
          node House_3D_Prototype/tools/add-csp.js _site/House_3D_Prototype/index.html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
