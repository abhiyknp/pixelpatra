<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pixelpatra demos</title>
<script src="../shared/pp-theme.js" data-pp="hub"></script>
<meta name="description" content="Try every Pixelpatra sample site: pick a demo, a device and where to start, from the dropdowns.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f97316'/%3E%3C/svg%3E">
<style>
:root { --bar: #1b1410; --ink: #fff; --muted: #cdbfb0; --accent: #f97316; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #e9e4dc; }
.bar { background: var(--bar); color: var(--ink); padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.bar .ttl { font-size: 15px; letter-spacing: .02em; margin: 0; font-weight: 700; }
.bar .ttl i { color: var(--accent); font-style: normal; }
.bar label { display: grid; gap: 2px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.bar .thm { display: grid; gap: 4px; } .bar .pp-swatches button.pp-sw { width: 30px; height: 30px; min-height: 0; padding: 0; border: 0; border-radius: 50%; background: conic-gradient(var(--b) 0 50%, var(--a) 0 75%, var(--c) 0); box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .45); display: block; } .bar .pp-swatches button.pp-sw[aria-checked="true"] { box-shadow: 0 0 0 2px #1b1410, 0 0 0 4px #fff; }
.bar select { font: inherit; font-size: 14px; color: #fff; background: #2b211b; border: 1px solid #5a4a3d; border-radius: 8px; padding: 8px 10px; min-height: 40px; max-width: 78vw; }
.bar select:focus-visible, .bar button:focus-visible, .bar a:focus-visible { outline: 3px solid #ffb27a; outline-offset: 2px; }
.bar .sp { flex: 1 1 0; }
.bar button, .bar a.btn { font: inherit; font-weight: 600; color: #fff; background: transparent; border: 1px solid #8a7766; border-radius: 8px; padding: 0 14px; min-height: 40px; display: inline-flex; align-items: center; text-decoration: none; cursor: pointer; }
.bar .opt { display: none; }
.bar button.get { background: #fff; color: #1b1410; border-color: #fff; }
.bar a.btn.go { background: var(--accent); border-color: var(--accent); color: #1b1410; }
.note { background: #2b211b; color: var(--muted); padding: 6px 14px; font-size: 12.5px; }
.stage { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: stretch; padding: 0; background: #d8d0c4; }
.frame { width: 100%; height: 100%; border: 0; background: #fff; }
.stage.phone { align-items: center; padding: 14px; }
.stage.phone .frame { width: 390px; max-width: 100%; height: min(844px, 100%); border-radius: 28px; border: 8px solid #111; box-shadow: 0 12px 40px rgba(0, 0, 0, .35); }
.stage.tablet { align-items: center; padding: 14px; }
.stage.tablet .frame { width: 820px; max-width: 100%; height: min(1100px, 100%); border-radius: 18px; border: 8px solid #111; box-shadow: 0 12px 40px rgba(0, 0, 0, .35); }
@media (max-width: 640px) { .bar .opt { display: inline-flex; font: inherit; font-weight: 600; color: #fff; background: transparent; border: 1px solid #8a7766; border-radius: 8px; padding: 0 14px; min-height: 40px; align-items: center; } .bar.collapsed label, .bar.collapsed .thm, .bar.collapsed #reset, .bar.collapsed #open, .bar.collapsed #home { display: none; } .bar.collapsed ~ .note { display: none; } .bar .ttl { width: auto; flex: 1; } .bar { gap: 8px; } .bar .ttl { width: 100%; } .bar label { flex: 1 1 140px; } .bar select { width: 100%; max-width: none; } .sp { display: none; } }
</style>
</head>
<body>
<header class="bar">
  <h1 class="ttl">Pixel<i>patra</i> demos</h1>
  <button id="opt" type="button" class="opt" aria-expanded="false" hidden>Options ▾</button>
  <label>Demo<select id="demo" aria-label="Demo"></select></label>
  <label>Device<select id="device" aria-label="Device"><option value="desktop">Website (full width)</option><option value="tablet">Tablet</option><option value="phone">Phone (installed app look)</option></select></label>
  <label>Start at<select id="start" aria-label="Start at"><option value="">Home page</option><option value="admin">Owner view</option></select></label>
  <span id="extra" style="display:contents"></span>
  <label class="thm">Theme<span id="swatches"></span></label>
  <span class="sp"></span>
  <button id="reset" type="button" title="Clears what you changed in the demos (orders, owner edits, sign-ins)">Reset demos</button>
  <a class="btn go" id="open" href="#" target="_blank" rel="noopener">Open full screen ↗</a>
  <a class="btn" id="home" href="../">Pixelpatra home</a>
  <button id="get" type="button" class="get" hidden>Get this template</button>
  <button id="close" type="button" hidden>Close ✕</button>
</header>
<div class="note" id="note"></div>
<main class="stage" id="stage"><iframe class="frame" id="frame" title="Demo" allow="fullscreen" loading="eager"></iframe></main>
<script>
// Pick a demo, a device and where to start; the choice is kept in the address so a link can be shared:
//   .../demo/?demo=oil&device=phone        .../demo/?demo=sample1&start=admin
(function () {
  var DEMOS = [
    { id: 'sample1', cats: ['ecommerce'], group: 'Shops', name: 'Sample 1 · Gift shop (full shop with Owner view)', url: '../Sample_1/index.html', owner: true, note: 'A complete shop: cart, test payments, orders, invoices and a locked Owner view. Everything you change stays in this browser.' },
    { id: 'house', cats: ['ecommerce', '3d'], group: 'Shops', name: 'Sample 1 + 3D house walk-through', url: '../House_3D_Prototype/index.html', owner: true, note: 'The same shop, opening with a scroll-driven 3D walk through a house. Use Home page above to switch between the walk and the gift shop.' },
    { id: 'portfolio', cats: ['portfolio', '3d'], group: 'Portfolios', name: 'Sample 3 · Portfolio (3D particle hero)', url: '../Sample_3/index.html', note: 'A portfolio whose name is made of thousands of particles. Move the pointer through them, then scroll: they scatter into a galaxy.' },
    { id: 'oil', cats: ['business', '3d'], group: 'Factories and makers', name: 'Sample 2 · Sunflower oil factory (seed to bottle film)', url: '../Sample_2/index.html', note: 'Scroll the film: field, sunflower, seeds, press, oil, bottles. Then orders, dealer enquiries and quality records.' },
    { id: 'intros', cats: ['3d'], group: 'Immersive openings', name: 'Scroll intros (openings A, B, C)', url: '../kits/scroll-intros/index.html', owner: true, note: 'Three scroll-driven openings. Use Opening and Theme above to switch, then scroll the homepage.' },
    { id: 'store', cats: [], group: 'Pixelpatra', name: 'Pixelpatra store page', url: '../index.html', note: 'The page that sells the templates.' }
  ];
  var $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.search);
  var CAT = q.get('cat'), EMBED = q.get('embed') === '1';
  if (CAT) DEMOS = DEMOS.filter(function (d) { return d.cats.indexOf(CAT) >= 0; });
  var groups = {}; DEMOS.forEach(function (d) { (groups[d.group] = groups[d.group] || []).push(d); });
  $('demo').innerHTML = Object.keys(groups).map(function (g) { return '<optgroup label="' + g + '">' + groups[g].map(function (d) { return '<option value="' + d.id + '">' + d.name + '</option>'; }).join('') + '</optgroup>'; }).join('');
  function pick(id) { return DEMOS.filter(function (d) { return d.id === id; })[0] || DEMOS[0]; }
  if (q.get('demo')) $('demo').value = pick(q.get('demo')).id;
  if (q.get('device')) $('device').value = q.get('device');
  if (q.get('start')) $('start').value = q.get('start');
  // the demo pages carry their own dark "Preview" bar (opening, theme, view, Owner view, Reset). Inside this picker it is
  // hidden, and the same choices are offered in the bar above instead, so there is one set of controls, not two.
  var CONTROLS = [
    { key: 'opening', label: 'Opening', select: '#opening-sel' },
    { key: 'home', label: 'Home page', buttons: ['#home-foyer', '#home-gift'] }
  ];
  // the six colour themes are global: one set of buttons for every template, saved in this browser
  window.ppTheme.mount($('swatches'), { onPick: function (id) { var f = $('frame'); try { f.contentWindow.postMessage({ pixelpatra: 'theme', id: id }, '*'); } catch (e) { /* not ready */ } } });
  var pending = { opening: q.get('opening'), home: q.get('home') };
  function docOf(f) { try { return f.contentDocument; } catch (e) { return null; } }
  function wire() {
    var f = $('frame'), doc = docOf(f), extra = $('extra'); extra.innerHTML = '';
    if (!doc || !doc.body) return;
    if (!doc.getElementById('hub-hide')) { var st = doc.createElement('style'); st.id = 'hub-hide'; st.textContent = '.proto{display:none!important}'; doc.head.appendChild(st); }
    var dev = $('device').value; var modeBtn = doc.querySelector(dev === 'phone' ? '#mode-app' : '#mode-web'); if (modeBtn && modeBtn.getAttribute('aria-pressed') !== 'true') modeBtn.click();
    CONTROLS.forEach(function (c) {
      var opts = [], el = null;
      if (c.select) { el = doc.querySelector(c.select); if (!el) return; opts = [].map.call(el.options, function (o) { return { v: o.value, t: o.textContent }; }); }
      else { var bs = c.buttons.map(function (sel) { return doc.querySelector(sel); }).filter(Boolean); if (bs.length < 2) return; opts = bs.map(function (b) { return { v: b.dataset.v, t: b.textContent.trim(), b: b }; }); }
      var lab = document.createElement('label'), sel = document.createElement('select'); lab.textContent = c.label; sel.setAttribute('aria-label', c.label);
      sel.innerHTML = opts.map(function (o) { return '<option value="' + o.v + '">' + o.t + '</option>'; }).join(''); lab.appendChild(sel); extra.appendChild(lab);
      function apply(v) {
        if (el) { el.value = v; el.dispatchEvent(new Event('change', { bubbles: true })); }
        else opts.forEach(function (o) { if (o.v === v) o.b.click(); });
        var s2 = new URLSearchParams(location.search); s2.set(c.key, v); history.replaceState(null, '', '?' + s2.toString());
      }
      if (pending[c.key] && opts.some(function (o) { return o.v === pending[c.key]; })) { sel.value = pending[c.key]; apply(pending[c.key]); }
      else if (el) sel.value = el.value; else { var on = opts.filter(function (o) { return o.b.getAttribute('aria-pressed') === 'true'; })[0]; if (on) sel.value = on.v; }
      sel.addEventListener('change', function () { apply(sel.value); });
    });
  }
  function show() {
    var d = pick($('demo').value), dev = $('device').value, start = $('start').value;
    $('start').querySelector('option[value="admin"]').disabled = !d.owner; if (!d.owner) $('start').value = start = '';
    var url = d.url + (start === 'admin' ? '#admin' : '');
    var f = $('frame');
    if (f.dataset.base !== d.url) { f.dataset.base = d.url; f.dataset.url = url; $('extra').innerHTML = ''; f.src = url; }
    else { if (f.dataset.url !== url) { f.dataset.url = url; f.src = url; } setTimeout(wire, 300); } // same page: only the device or the start changed
    $('stage').className = 'stage ' + (dev === 'phone' ? 'phone' : dev === 'tablet' ? 'tablet' : '');
    $('open').href = url; $('note').textContent = d.note;
    var s = new URLSearchParams(); s.set('demo', d.id); if (dev !== 'desktop') s.set('device', dev); if (start) s.set('start', start);
    ['opening', 'home'].forEach(function (k) { if (pending[k] && d.id === (q.get('demo') || 'sample1')) s.set(k, pending[k]); });
    history.replaceState(null, '', '?' + s.toString()); document.title = d.name.split(' (')[0] + ' · Pixelpatra demos';
  }
  $('frame').addEventListener('load', function () { [250, 1200, 2800, 5000].forEach(function (ms) { setTimeout(wire, ms); }); });
  $('demo').addEventListener('change', function () { pending = {}; show(); });
  ['device', 'start'].forEach(function (id) { $(id).addEventListener('change', show); });
  $('reset').addEventListener('click', function () {
    if (!confirm('Clear everything you changed in the demos (orders, Owner edits, sign-ins)?')) return;
    try { localStorage.clear(); sessionStorage.clear(); } catch (e) { /* blocked */ }
    var f = $('frame'); f.src = f.dataset.url || f.src;
  });
  if (EMBED) { $('home').hidden = true; $('close').hidden = false; $('get').hidden = false;
    $('close').addEventListener('click', function () { parent.postMessage({ pixelpatra: 'close' }, '*'); });
    $('get').addEventListener('click', function () { parent.postMessage({ pixelpatra: 'get', demo: $('demo').value }, '*'); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') parent.postMessage({ pixelpatra: 'close' }, '*'); }); }
  // on phones the options fold away, so the demo gets the screen
  var bar = document.querySelector('.bar'), opt = $('opt');
  if (matchMedia('(max-width: 640px)').matches) { opt.hidden = false; bar.classList.add('collapsed'); }
  opt.addEventListener('click', function () { var c = bar.classList.toggle('collapsed'); opt.setAttribute('aria-expanded', String(!c)); opt.textContent = c ? 'Options ▾' : 'Options ▴'; });
  show();
})();
</script>
</body>
</html>
