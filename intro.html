<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixelpatra Intro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: one dark room, one sheet of paper in the middle. The page is the hero; everything else stays quiet.
   Deliberately single-theme (night room + paper), every colour set explicitly. */
:root {
  color-scheme: light;
  color-scheme: dark;
  --night: #0d0c0b;
  --night-2: #171512;
  --paper: #f4f0e8;
  --paper-ink: #1d1a16;
  --paper-mute: #8a8274;
  --paper-line: #e2dbcd;
  --gold: #c7a15f;
  --gold-soft: #e4c88f;
  --text: #ebe5d9;
  --text-mute: #8f897d;
  --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --sans: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
* { box-sizing: border-box; }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 4px; }

.room {
  position: relative; min-height: 100%;
  display: grid; place-items: center;
  padding-block: 72px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(ellipse 70% 55% at 50% 48%, var(--night-2), var(--night) 70%);
  overflow: hidden;
}
/* a faint warm light that drifts with the pointer */
.glow { position: absolute; inset: -20%; pointer-events: none; background: radial-gradient(circle 32vmax at var(--gx, 50%) var(--gy, 45%), rgba(199,161,95,.10), transparent 70%); transition: background .6s ease; }

.top { position: absolute; top: calc(18px + env(safe-area-inset-top, 0px)); left: max(20px, env(safe-area-inset-left, 0px)); right: max(20px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; align-items: center; z-index: 5; }
.mark { font-family: var(--mono); font-size: 12px; letter-spacing: .32em; text-transform: uppercase; color: var(--text-mute); opacity: 0; transition: opacity 1.2s ease; }
.mark b { color: var(--gold); font-weight: 400; }
.ghost { background: none; border: 0; color: var(--text-mute); font-size: 13px; letter-spacing: .04em; cursor: pointer; padding: 8px 4px; opacity: 0; transition: opacity .8s ease, color .2s; }
.ghost:hover { color: var(--text); }
.on { opacity: 1 !important; }

/* Opening line */
.line { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font-family: var(--serif); font-style: italic; font-size: clamp(26px, 4.4vw, 46px); color: var(--text); padding-inline: 24px; transition: opacity 1s ease, transform 1.4s cubic-bezier(.2,.7,.1,1), filter 1s ease; text-wrap: balance; }
.line span { display: inline-block; opacity: 0; transform: translateY(8px); filter: blur(6px); transition: opacity 1s ease, transform 1s ease, filter 1s ease; }
.line span.in { opacity: 1; transform: none; filter: none; }
.line.away { opacity: 0; transform: translateY(calc(-50% - 60px)); filter: blur(4px); }

/* The sheet */
.stage { width: min(760px, 100%); display: grid; gap: 14px; justify-items: center; }
.url { font-family: var(--mono); font-size: 12px; color: var(--text-mute); letter-spacing: .04em; opacity: 0; transition: opacity .8s ease; min-height: 1.4em; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.url b { color: var(--gold-soft); font-weight: 400; }
.sheet-wrap { width: 100%; position: relative; }
.thread { position: absolute; left: 50%; top: 50%; height: 1px; width: 0; background: linear-gradient(90deg, transparent, var(--gold), transparent); transform: translate(-50%, -50%); transition: width 1.1s cubic-bezier(.6,0,.2,1), opacity .6s ease .3s; }
.thread.drawn { width: 100%; }
.thread.done { opacity: 0; }
.sheet {
  position: relative; width: 100%; aspect-ratio: 16 / 10.5; max-width: 100%;
  background:
    radial-gradient(ellipse at 30% 0%, rgba(255,255,255,.6), transparent 60%),
    var(--paper);
  color: var(--paper-ink); border-radius: 3px;
  box-shadow: 0 1px 0 rgba(255,255,255,.5) inset, 0 40px 80px -30px rgba(0,0,0,.85), 0 0 0 1px rgba(0,0,0,.2);
  transform: scaleY(.002); opacity: 0; transform-origin: 50% 50%;
  transition: transform 1.3s cubic-bezier(.7,0,.15,1), opacity .4s ease;
  overflow: hidden;
}
.sheet.open { transform: none; opacity: 1; }
.grain { position: absolute; inset: 0; pointer-events: none; opacity: .35; mix-blend-mode: multiply; }
@media (max-width: 640px) { .sheet { aspect-ratio: 4 / 5; } .seal { bottom: 24%; } }

.page { position: absolute; inset: 0; padding: 5.5% 7%; display: grid; grid-template-rows: auto 1fr auto; }
.page-nav { display: flex; align-items: center; gap: 14px; opacity: 0; transform: translateY(-6px); transition: opacity .9s ease, transform .9s ease; }
.mono-mark { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--paper-ink); display: grid; place-items: center; font-family: var(--serif); font-size: 15px; letter-spacing: .02em; }
.page-nav .links { margin-left: auto; display: flex; gap: 18px; }
.page-nav .links i { display: block; width: 46px; height: 1px; background: var(--paper-mute); opacity: .7; }
@media (max-width: 640px) { .page-nav .links i { width: 26px; } .page-nav .links { gap: 10px; } }

.center { align-self: center; display: grid; gap: 14px; }
.ask { font-family: var(--serif); font-size: clamp(20px, 2.6vw, 28px); color: var(--paper-mute); opacity: 0; transition: opacity 1s ease; }
.ask em { color: var(--paper-ink); }
.namefield { position: relative; }
.namefield input { position: absolute; inset: 0; width: 100%; opacity: 0; font-size: 16px; border: 0; background: transparent; cursor: text; }
.typed { font-family: var(--serif); font-size: clamp(44px, 8.6vw, 92px); line-height: 1; letter-spacing: -.015em; min-height: 1.05em; display: flex; flex-wrap: wrap; align-items: baseline; word-break: break-word; }
.typed .ph { color: var(--paper-line); }
.typed .ch { display: inline-block; animation: ink .5s ease both; white-space: pre; }
@keyframes ink { from { opacity: 0; filter: blur(5px); transform: translateY(6px); } to { opacity: 1; filter: none; transform: none; } }
.caret { display: inline-block; width: 2px; height: .82em; background: var(--gold); margin-left: 4px; animation: caret 1.1s steps(1) infinite; align-self: center; }
@keyframes caret { 50% { opacity: 0; } }
.rule { height: 1px; width: 0; background: var(--gold); transition: width 1.2s cubic-bezier(.3,.7,.1,1); }
.rule.drawn { width: min(320px, 70%); }
.tag { font-size: clamp(14px, 1.6vw, 17px); color: var(--paper-mute); opacity: 0; transition: opacity 1s ease; min-height: 1.4em; }

.page-foot { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4%; opacity: 0; transition: opacity 1.2s ease; }
.page-foot div { display: grid; gap: 7px; }
.page-foot b { font-family: var(--mono); font-weight: 400; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--paper-mute); }
.page-foot i { display: block; height: 1px; background: var(--paper-line); }
.page-foot i:nth-child(3) { width: 70%; }

/* Wax seal */
.seal { position: absolute; right: 6%; bottom: 9%; width: clamp(64px, 10vw, 92px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, #d9b06a, #a57a33 55%, #7a5622);
  box-shadow: 0 3px 0 rgba(0,0,0,.15), 0 10px 22px -6px rgba(90,60,20,.6), inset 0 0 0 4px rgba(255,236,190,.25), inset 0 0 0 7px rgba(90,60,20,.25);
  color: #fff3d9; font-family: var(--serif); font-size: clamp(22px, 3.4vw, 32px); text-shadow: 0 1px 0 rgba(90,60,20,.6);
  opacity: 0; transform: scale(2.2) rotate(-18deg); pointer-events: none; }
.seal.stamp { animation: stamp .7s cubic-bezier(.5,0,.3,1.4) forwards; }
@keyframes stamp { 0% { opacity: 0; transform: scale(2.2) rotate(-18deg); } 60% { opacity: 1; transform: scale(.94) rotate(-6deg); } 100% { opacity: 1; transform: scale(1) rotate(-8deg); } }
.sheet.thud { animation: thud .35s ease .42s; }
@keyframes thud { 40% { transform: scale(.992); } }

.below { min-height: 64px; display: grid; justify-items: center; gap: 14px; text-align: center; }
.hint { font-size: 13px; color: var(--text-mute); opacity: 0; transition: opacity .8s ease; }
.hint kbd { font-family: var(--mono); font-size: 11px; border: 1px solid #3a352d; border-radius: 4px; padding: 1px 6px; color: var(--text); }
.done-msg { font-family: var(--serif); font-style: italic; font-size: clamp(22px, 3vw, 30px); color: var(--text); }
.choices { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.choice { min-height: 46px; padding: 12px 22px; border-radius: 999px; border: 1px solid #4a4336; background: transparent; color: var(--text); font-size: 15px; font-weight: 500; letter-spacing: .01em; cursor: pointer; transition: border-color .2s, background .2s, color .2s; }
.choice:hover { border-color: var(--gold); }
.choice.primary { background: var(--gold); border-color: var(--gold); color: #1a140b; }
.fade-in { animation: fadeUp .9s ease both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.note { font-size: 13px; color: var(--text-mute); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; animation-delay: 0ms !important; }
}
</style>
</head>
<body>

<div class="room" id="room">
  <div class="glow" id="glow"></div>
  <div class="top">
    <span class="mark" id="mark">Pixel<b>patra</b></span>
    <button class="ghost" id="skip" type="button">Skip intro</button>
  </div>

  <p class="line" id="line" aria-hidden="true"></p>

  <div class="stage" id="stage">
    <div class="url" id="url" aria-live="polite"></div>
    <div class="sheet-wrap">
      <div class="thread" id="thread"></div>
      <div class="sheet" id="sheet">
        <canvas class="grain" id="grain"></canvas>
        <div class="page">
          <div class="page-nav" id="nav"><span class="mono-mark" id="mono">P</span><span class="links"><i></i><i></i><i></i></span></div>
          <div class="center">
            <p class="ask" id="ask">Every website begins as a blank page. <em>What should yours say?</em></p>
            <label class="namefield" for="name">
              <span class="typed" id="typed" aria-hidden="true"><span class="ph">Your name</span><span class="caret"></span></span>
              <input id="name" type="text" maxlength="26" autocomplete="name" spellcheck="false" aria-label="Your name or your business name">
            </label>
            <div class="rule" id="rule"></div>
            <p class="tag" id="tag"></p>
          </div>
          <div class="page-foot" id="foot">
            <div><b>About</b><i></i><i></i></div>
            <div><b>Work</b><i></i><i></i></div>
            <div><b>Contact</b><i></i><i></i></div>
          </div>
        </div>
        <div class="seal" id="seal" aria-hidden="true">P</div>
      </div>
    </div>
    <div class="below" id="below">
      <p class="hint" id="hint">Type your name, or your business name. Press <kbd>Enter</kbd> when it looks right.</p>
    </div>
  </div>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const room = $("room"), glow = $("glow"), line = $("line"), sheet = $("sheet"), thread = $("thread");
  const input = $("name"), typed = $("typed"), url = $("url"), nav = $("nav"), mono = $("mono"), ask = $("ask");
  const rule = $("rule"), tag = $("tag"), foot = $("foot"), seal = $("seal"), hint = $("hint"), below = $("below");
  let timers = [], sealed = false, introDone = false;
  const at = (ms, fn) => timers.push(setTimeout(fn, reduce ? 0 : ms));

  /* paper grain, drawn once */
  function grain() {
    const c = $("grain"), r = sheet.getBoundingClientRect(), w = Math.max(200, Math.round(r.width / 2)), h = Math.max(150, Math.round(r.height / 2 || w * .65));
    c.width = w; c.height = h; c.style.width = "100%"; c.style.height = "100%";
    const x = c.getContext("2d"), img = x.createImageData(w, h);
    for (let i = 0; i < img.data.length; i += 4) { const v = 200 + Math.random() * 55; img.data[i] = v; img.data[i + 1] = v - 4; img.data[i + 2] = v - 12; img.data[i + 3] = 40; }
    x.putImageData(img, 0, 0);
  }

  /* pointer light */
  room.addEventListener("pointermove", e => {
    const r = room.getBoundingClientRect();
    glow.style.setProperty("--gx", ((e.clientX - r.left) / r.width * 100) + "%");
    glow.style.setProperty("--gy", ((e.clientY - r.top) / r.height * 100) + "%");
  });

  /* opening line, word by word */
  const words = "Every website begins as a blank page.".split(" ");
  line.innerHTML = words.map(w => `<span>${w}</span>`).join(" ");

  function play() {
    timers.forEach(clearTimeout); timers = [];
    at(200, () => $("mark").classList.add("on"));
    at(600, () => $("skip").classList.add("on"));
    line.querySelectorAll("span").forEach((s, i) => at(700 + i * 260, () => s.classList.add("in")));
    at(3300, () => line.classList.add("away"));
    at(3700, () => thread.classList.add("drawn"));
    at(4700, () => { sheet.classList.add("open"); thread.classList.add("done"); });
    at(5900, finishIntro);
  }
  function finishIntro() {
    if (introDone) return; introDone = true;
    timers.forEach(clearTimeout); timers = [];
    line.style.display = "none"; thread.classList.add("drawn", "done"); sheet.classList.add("open");
    $("mark").classList.add("on"); $("skip").classList.remove("on");
    grain();
    setTimeout(() => ask.classList.add("on"), reduce ? 0 : 100);
    setTimeout(() => { url.classList.add("on"); hint.classList.add("on"); renderUrl(""); input.focus({ preventScroll: true }); }, reduce ? 0 : 700);
  }
  $("skip").addEventListener("click", finishIntro);

  /* typing composes the page */
  const slug = s => s.toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const initials = s => s.trim().split(/\s+/).filter(Boolean).map(w => w[0]).join("").slice(0, 2).toUpperCase();
  function renderUrl(v) { const s = slug(v); url.innerHTML = "pixelpatra.in/" + (s ? `<b>${s}</b>` : "<b>your-name</b>"); }
  let prev = "";
  function render() {
    const v = input.value;
    // keep already-inked letters, ink only the new ones
    const keep = v.startsWith(prev) ? prev.length : 0;
    const old = Array.from(typed.querySelectorAll(".ch")).slice(0, keep);
    typed.innerHTML = "";
    if (!v) typed.innerHTML = '<span class="ph">Your name</span>';
    old.forEach(n => { n.style.animation = "none"; typed.appendChild(n); });
    for (let i = keep; i < v.length; i++) { const s = document.createElement("span"); s.className = "ch"; s.textContent = v[i]; typed.appendChild(s); }
    const c = document.createElement("span"); c.className = "caret"; typed.appendChild(c);
    prev = v;
    renderUrl(v);
    const n = v.trim().length;
    nav.classList.toggle("on", n >= 1);
    mono.textContent = initials(v) || "P";
    rule.classList.toggle("drawn", n >= 3);
    tag.classList.toggle("on", n >= 3);
    tag.textContent = n >= 3 ? `The website of ${v.trim()}.` : "";
    foot.classList.toggle("on", n >= 5);
    ask.classList.toggle("on", !n);
  }
  input.addEventListener("input", () => { if (!sealed) render(); });
  input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); seal_(); } });
  sheet.addEventListener("click", () => { if (!sealed) input.focus(); });

  function seal_() {
    const v = input.value.trim();
    if (v.length < 2 || sealed) { if (!v) { input.focus(); hint.textContent = "Start with your name, or your business name."; } return; }
    sealed = true; input.blur();
    typed.querySelector(".caret")?.remove();
    seal.textContent = initials(v) || "P";
    seal.classList.add("stamp"); sheet.classList.add("thud");
    nav.classList.add("on"); rule.classList.add("drawn"); tag.classList.add("on"); foot.classList.add("on");
    setTimeout(() => {
      below.innerHTML = "";
      const m = document.createElement("p"); m.className = "done-msg fade-in"; m.textContent = `${v}, your page is ready to be made.`;
      const ch = document.createElement("div"); ch.className = "choices fade-in"; ch.style.animationDelay = ".25s";
      ch.innerHTML = '<button class="choice primary" type="button">It\'s for me</button><button class="choice" type="button">It\'s for my business</button><button class="choice" type="button" id="again">Start again</button>';
      const note = document.createElement("p"); note.className = "note fade-in"; note.style.animationDelay = ".5s"; note.id = "next-note";
      note.textContent = "Prototype: the next step opens your chosen template with your name in it.";
      below.append(m, ch, note);
      ch.querySelectorAll(".choice:not(#again)").forEach(b => b.addEventListener("click", () => { note.textContent = "That step comes next, once you approve this intro."; }));
      $("again").addEventListener("click", restart);
    }, reduce ? 0 : 900);
  }

  function restart() {
    sealed = false; introDone = false; prev = ""; input.value = "";
    seal.classList.remove("stamp"); sheet.classList.remove("open", "thud");
    thread.classList.remove("drawn", "done"); line.style.display = ""; line.classList.remove("away");
    line.querySelectorAll("span").forEach(s => s.classList.remove("in"));
    [nav, rule, tag, foot, ask, url, hint].forEach(el => el.classList.remove("on", "drawn"));
    below.innerHTML = ""; below.appendChild(hint); hint.innerHTML = 'Type your name, or your business name. Press <kbd>Enter</kbd> when it looks right.';
    render(); url.innerHTML = "";
    play();
  }

  render(); url.innerHTML = "";
  if (reduce) finishIntro(); else play();
})();
</script>
</body>
</html>
